name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform
        run: flutter create . --platforms=android --org pl.gekogroup --project-name geko_fleet

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Prepare artifact
        run: cp build/app/outputs/flutter-apk/app-release.apk GEKO-Fleet.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GEKO-Fleet-APK
          path: GEKO-Fleet.apk
          retention-days: 30
